<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>body{font-family:'Comfortaa',sans-serif;padding:16px;background:#f8fafc}</style>
</head>
<body>
  <div class="w-full max-w-md mx-auto">
    <p class="text-sm text-gray-700 mb-4">This will remove transactions, investments and balance history for '<span id="acctName"><?!= accountName ?></span>' from the current spreadsheet. Do you want to proceed?</p>
    <div class="flex gap-3">
      <button id="btnYes" class="cursor-pointer px-3 py-1.5 bg-red-600 text-white rounded text-sm">Yes, remove data</button>
      <button id="btnNo" class="cursor-pointer px-3 py-1.5 bg-slate-100 text-slate-700 rounded border text-sm">Cancel</button>
    </div>
  </div>

  <script>
    const accountId = '<?!= accountId ?>';
    document.getElementById('btnYes').addEventListener('click', function(){
      const yes = document.getElementById('btnYes');
      const no = document.getElementById('btnNo');
      yes.disabled = true;
      yes.textContent = 'Please wait..';
      if(no) no.disabled = true;
      google.script.run.withSuccessHandler(function(resp){
        try{ google.script.host.close(); }catch(e){}
      }).withFailureHandler(function(err){
        alert('Failed to start unlink: ' + (err && err.message));
        try{ google.script.host.close(); }catch(e){}
      }).confirmUnlinkAccountFromTemplateConfirmed(accountId);
    });

    document.getElementById('btnNo').addEventListener('click', function(){
      try{ google.script.host.close(); }catch(e){}
    });
  </script>
</body>
</html>
