<? if( accounts.length === 0 ) { ?>
  <p class="text-gray-600 text-center mt-5">No connected bank accounts yet</p>
<? }else{ ?>
  <? accounts.forEach(function(account) { ?>
    <div class="bg-white rounded-lg border border-gray-400 transition-colors overflow-hidden">
      <div class="px-3.5 py-3 flex items-center justify-between gap-2.5 px-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="min-w-0">
            <div class="font-medium text-gray-900 leading-tight truncate">
              <?= account?.name || 'Unknown' ?>
            </div>
            <div class="text-gray-600 leading-none mt-2">
              <?= account.institution_name || '—' ?> • <?= account.mask || 'XXXX' ?> 
            </div>
          </div>
        </div>
        <? if(account.is_linked){ ?>
          <small class="px-1.5 py-0.5 rounded-full bg-green-100 text-green-800 shrink-0">Linked</small>
        <? } else { ?>
          <small class="px-1.5 py-0.5 rounded-full bg-red-100 text-red-800 shrink-0">Unlinked</small>
        <? } ?>
      </div>
      <? if(account.is_linked){ ?>
        <div class="border-t border-gray-400 text-center py-2 px-2 theme-bg-primary text-white">
          <button class="cursor-pointer btn-view-detail"
                  data-account-id="<?= account.account_id ?>">
            Make Changes →
          </button>
        </div>
      <? } else { ?>
        <div class="border-t border-gray-400 text-center py-2 px-2 theme-bg-primary text-white">
          <button class="cursor-pointer btn-view-detail"
                  data-account-id="<?= account.account_id ?>">
            Bring in Data →
          </button>
        </div>
      <? } ?>
    </div>
  <? }); ?>
  <script>
    document.querySelectorAll('.btn-view-detail').forEach(function(btn) {
      btn.addEventListener('click', function() { viewAccountDetail(this.dataset.accountId); });
    });
  </script>
<? } ?>
