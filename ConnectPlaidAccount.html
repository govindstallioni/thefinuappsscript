<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <style>
    :root{
      --primary-font: 'Comfortaa', sans-serif;
      --color_01 : #6E8277;
      --color_02 : #37484C;
      --color_03 : #6E434D;
      --color_04 : #E68E68;
      --color_05 : #EEC49F;
      --color_06 : #E9EAD1;
    }
    .theme-primary { color: var(--color_02); }
    .theme-secondary { color: var(--color_01); }
    .theme-accent { color: var(--color_03); }
    .theme-light { color: var(--color_04); }
    .theme-semi-light { color: var(--color_06); }
    .theme-bg-primary { background-color: var(--color_02); }
    .theme-bg-secondary { background-color: var(--color_01); }
    .theme-bg-accent { background-color: var(--color_03); }
    .theme-bg-light { background-color: var(--color_04); }
    .theme-bg-semi-light { background-color: var(--color_06); }
    body { font-family: var(--primary-font); padding: 0; margin: 0; background: #f9fafb; }
    #loader { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9999; }
    #loader-content {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
    }
    .center-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1rem;
    }
    h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: #4b5563; margin-bottom: 1.5rem; }
  </style>
</head>
<body class="p-6">

<div id="loader">
  <div id="loader-content">
    <div class="animate-spin w-12 h-12 mx-auto mb-4 border-4 border-blue-500 border-t-transparent rounded-full"></div>
    <p>Connecting with Plaid...</p>
  </div>
</div>

<div class="center-container" id="plaid-content">
  <h2>Connect Your Bank Account</h2>
  <p>Securely link your financial accounts with Plaid.<br>Start syncing transactions, balances and more.</p>
</div>

<script>
function showloader(msg = "Connecting...") {
  document.getElementById('loader').style.display = 'block';
  document.querySelector('#loader p').textContent = msg;
}

function hideloader() {
  document.getElementById('loader').style.display = 'none';
}

window.onload = function() {
  showloader("Preparing Plaid Link...");
  initPlaidApp();
};

function connectPlaidModalUI(link_token) {
  //console.log("Link Token: "+ link_token);
  const handler = Plaid.create({
    token: link_token,
    onSuccess: (public_token, metadata) => {
      showloader("Finalizing connection...");
      google.script.run.withSuccessHandler((response) => {
        hideloader();
        showPlaidSuccessUI(response);
      }).withFailureHandler(err => {
        hideloader();
        alert("Connection failed: " + (err.message || "Unknown error"));
        google.script.host.close();
      }).exchangePublicTokenForAccessToken(public_token, metadata);
    },
    onExit: (err, metadata) => {
      hideloader();
      if (err != null) {
        console.warn("User exited with error:", err);
      }
      google.script.host.close();
    },
    onEvent: (eventName, metadata) => {
      // You can log events for debugging
      // console.log(eventName, metadata);
    }
  });

  handler.open();
}

function initPlaidApp() {
  google.script.run.withSuccessHandler(resp => {
    console.log("response: "+ resp);
    hideloader();
    connectPlaidModalUI(resp.link_token);
  }).withFailureHandler(err => {
    hideloader();
    alert("Cannot start Plaid. " + (err.message || ""));
    google.script.host.close();
  }).generatePlaidTokenLink();
}

function showPlaidSuccessUI(response){
  const container = document.getElementById('plaid-content');
  if (!container) return;
  container.innerHTML = '';
  const title = document.createElement('h2');
  title.textContent = 'Accounts Connected';
  const message = document.createElement('p');
  message.innerHTML = 'Your account(s) were successfully connected. Click the button below to open the app.';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.id = 'plaid-success-btn';
  btn.className = 'cursor-pointer w-full theme-bg-primary text-white py-2 rounded mt-4';
  btn.textContent = 'Open App';
  btn.addEventListener('click', function(){
    // Disable button and show progress
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Opening...';
    // Trigger server-side function to show the sidebar, then close dialog on success
    google.script.run.withSuccessHandler(function(){
      try { google.script.host.close(); } catch(e) { /* ignore */ }
    }).withFailureHandler(function(err){
      btn.disabled = false;
      btn.textContent = originalText;
      alert('Unable to open app. Please try again.');
      console.error('showSidebar failed', err);
    }).showSidebar();
  });
  container.appendChild(title);
  container.appendChild(message);
  container.appendChild(btn);
}
</script>
</body>
</html>
