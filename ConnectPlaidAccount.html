<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <style>
    :root{
        --primary-font: 'Comfortaa', sans-serif;
        --color_01 : #6E8277;
        --color_02 : #37484C;
        --color_03 : #6E434D;
        --color_04 : #E68E68;
        --color_05 : #EEC49F;
        --color_06 : #E9EAD1;
    }
    .theme-primary { color: var(--color_02); }
    .theme-secondary { color: var(--color_01); }
    .theme-accent { color: var(--color_03); }
    .theme-light { color: var(--color_04); }
    .theme-semi-light { color: var(--color_06); }
    .theme-bg-primary { background-color: var(--color_02); }
    .theme-bg-secondary { background-color: var(--color_01); }
    .theme-bg-accent { background-color: var(--color_03); }
    .theme-bg-light { background-color: var(--color_04); }
    .theme-bg-semi-light { background-color: var(--color_06); }
    body{ font-family: var(--primary-font); margin:0; padding:20px; background:#f1f5f9 }
    .fade-in{ animation: fadeIn .32s ease; }
    @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:translateY(0) } }
    .loader-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:9999 }
    .loader-centered{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center }
    .spinner{ width:44px; height:44px; border:4px solid rgba(255,255,255,0.28); border-top:4px solid rgba(255,255,255,0.95); border-radius:50%; animation:spin 1s linear infinite }
    @keyframes spin{ to{ transform:rotate(360deg) } }
  </style>
</head>
<body>
  <div id="loader" class="loader-overlay"><div class="loader-centered"><div class="spinner"></div><p id="loaderText" class="text-white mt-3">Please wait...</p></div></div>

  <div id="statusBanner" class="mb-4"></div>

  <main class="max-w-2xl mx-auto">
    <section id="plaid-content" class="bg-white rounded-lg shadow-sm p-6 fade-in">
      <div class="mt-0" id="plaid-actions">
        <div class="space-y-3">
          <p class="text-sm text-slate-600">Click "Connect with Plaid" to open the Plaid Link modal. After connecting, you can import historical data.</p>
          <div class="flex gap-3 mt-2 justify-center">
            <button id="btnConnectPlaid" class="cursor-pointer px-4 py-2 theme-bg-primary text-white rounded shadow-sm">Connect with Plaid</button>
            <button id="btnOpenApp" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded border" style="display:none">Open App</button>
          </div>
        </div>
      </div>

      <!-- Import Historical Data block removed per request -->
    </section>
  </main>

  <script>
    function showloader(msg){ document.getElementById('loader').style.display='block'; document.getElementById('loaderText').textContent = msg || 'Please wait...'; }
    function hideloader(){ document.getElementById('loader').style.display='none'; }

    function showMessage(msg, type, duration){
      const banner = document.getElementById('statusBanner');
      if(!banner){ try{ alert(msg); }catch(e){} return; }
      banner.innerHTML = '';
      const div = document.createElement('div');
      div.className = (type === 'error') ? 'bg-red-50 border border-red-200 text-red-800 p-3 rounded' : 'bg-emerald-50 border border-emerald-200 text-emerald-800 p-3 rounded';
      div.textContent = msg;
      banner.appendChild(div);
      if(type !== 'error') setTimeout(function(){ banner.innerHTML=''; }, duration || 5000);
    }

    function connectPlaidModalUI(link_token){
      try{
        const handler = Plaid.create({
          token: link_token,
          onSuccess: function(public_token, metadata){
            showloader('Finalizing connection...');
            google.script.run.withSuccessHandler(function(response){ hideloader(); showPlaidSuccessUI(response); }).withFailureHandler(function(err){ hideloader(); showMessage('Connection failed: '+(err.message||'Unknown'),'error'); }).exchangePublicTokenForAccessToken(public_token, metadata);
          },
          onExit: function(err, metadata){ hideloader(); if(err) console.warn('Plaid exit error', err); },
          onEvent: function(){}
        });
        handler.open();
      }catch(e){ showMessage('Plaid Link failed to open.','error'); }
    }

    function initPlaidApp(){
      showloader('Preparing Plaid Link...');
      google.script.run.withSuccessHandler(function(resp){ hideloader(); if(resp && resp.link_token) connectPlaidModalUI(resp.link_token); else showMessage('Unable to start Plaid.','error'); }).withFailureHandler(function(err){ hideloader(); showMessage('Cannot start Plaid: ' + (err.message||''),'error'); }).generatePlaidTokenLink();
    }

    function buildAccountCard(acc){
      const card = document.createElement('div');
      card.className = 'p-3 border rounded flex items-center justify-between mb-2';
      const left = document.createElement('div');
      const name = document.createElement('div'); name.className='font-medium'; name.textContent = acc.account_name || 'Account';
      const meta = document.createElement('div'); meta.className='text-sm text-slate-500'; meta.textContent = (acc.subtype ? acc.subtype + (acc.mask ? ' • ' + acc.mask : '') : (acc.mask||''));
      left.appendChild(name); left.appendChild(meta);
      const right = document.createElement('div'); right.className='text-xs text-slate-500'; right.textContent = acc.institution ? acc.institution : '';
      card.appendChild(left); card.appendChild(right);
      return card;
    }

    function showPlaidSuccessUI(response){
      // Render a friendly success screen with account summary
      const container = document.getElementById('plaid-content');
      container.innerHTML = '';
      const header = document.createElement('div'); header.className = 'mb-3';
      const title = document.createElement('h2'); title.className = 'text-lg font-semibold'; title.textContent = 'Accounts Connected';
      const subtitle = document.createElement('div'); subtitle.className='text-sm text-slate-500 mt-1';
      subtitle.textContent = 'Your Plaid connection was successful.';
      header.appendChild(title); header.appendChild(subtitle);
      container.appendChild(header);
        
      const actions = document.createElement('div'); actions.className='flex gap-3';
      const openBtn = document.createElement('button'); openBtn.className='cursor-pointer px-4 py-2 bg-sky-600 text-white rounded'; openBtn.textContent='Open App';
      openBtn.addEventListener('click', function(){ openBtn.disabled=true; google.script.run.withSuccessHandler(function(){ try{ google.script.host.close(); }catch(e){} }).withFailureHandler(function(err){ openBtn.disabled=false; showMessage('Unable to open app.','error'); }).showSidebar(); });

      const closeBtn = document.createElement('button'); closeBtn.className='cursor-pointer px-4 py-2 bg-slate-100 text-slate-700 rounded border'; closeBtn.textContent='Close';
      closeBtn.addEventListener('click', function(){ try{ google.script.host.close(); }catch(e){} });

      actions.appendChild(openBtn); actions.appendChild(closeBtn);
      container.appendChild(actions);
      showMessage('Account connected successfully.', 'success');
    }

    function showPlaidFailureUI(err){
      const container = document.getElementById('plaid-content');
      container.innerHTML = '';
      const title = document.createElement('h2'); title.className='text-lg font-semibold mb-2'; title.textContent = 'Connection Failed';
      const msg = document.createElement('div'); msg.className='p-3 bg-red-50 border border-red-100 text-red-800 rounded mb-3'; msg.textContent = (err && err.message) ? err.message : 'Plaid connection failed. Please try again.';
      container.appendChild(title); container.appendChild(msg);

      const actions = document.createElement('div'); actions.className='flex gap-3';
      const retry = document.createElement('button'); retry.className='px-4 py-2 bg-sky-600 text-white rounded'; retry.textContent='Retry';
      retry.addEventListener('click', function(){ retry.disabled=true; showloader('Retrying...'); google.script.run.withSuccessHandler(function(resp){ hideloader(); retry.disabled=false; if(resp && resp.link_token) connectPlaidModalUI(resp.link_token); else showMessage('Unable to start Plaid.','error'); }).withFailureHandler(function(e){ hideloader(); retry.disabled=false; showMessage('Cannot start Plaid: '+(e.message||''),'error'); }).generatePlaidTokenLink(); });

      container.appendChild(actions);
      showMessage('Connection failed. See details above.','error',7000);
    }

    // account list UI removed (import handled in separate runner)

    document.addEventListener('DOMContentLoaded', function(){
      // wire buttons
      document.getElementById('btnConnectPlaid').addEventListener('click', function(){ showloader('Preparing Plaid Link...'); google.script.run.withSuccessHandler(function(resp){ hideloader(); if(resp && resp.link_token) connectPlaidModalUI(resp.link_token); else showMessage('Unable to start Plaid.','error'); }).withFailureHandler(function(err){ hideloader(); showMessage('Cannot start Plaid: ' + (err.message||''),'error'); }).generatePlaidTokenLink(); });

      document.getElementById('btnOpenApp').addEventListener('click', function(){ this.disabled=true; google.script.run.withSuccessHandler(function(){ try{ google.script.host.close(); }catch(e){} }).withFailureHandler(function(err){ showMessage('Unable to open app.','error'); }).showSidebar(); });

      // prefetch removed; import is started from the runner UI
    });
  </script>
</body>
</html>
