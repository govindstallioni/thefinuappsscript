<div class="">
    <h2 class="text-sm font-semibold mb-4">Choose your account type for add your balance history</h2>
    <form id="balance-history-form" class="space-y-4" onsubmit="submitBalanceHistoryForm(event)">
        <div class="flex mb-4 space-x-0.5">
            <button type="button" 
                id="use-existing-account-btn"
                class="cursor-pointer flex-1 py-2 px-4 bg-gray-200 text-gray-700 rounded-l-lg font-medium transition border border-gray-400"
                onclick="showExistingAccountFields(this)">Use Existing Account</button>
            <button type="button" 
                id="use-manual-account-btn"
                class="cursor-pointer flex-1 py-2 px-4 bg-gray-200 text-gray-700 rounded-r-lg font-medium transition border border-gray-400"
                onclick="showManualAccountFields(this)">Enter Manual Account</button>
        </div>
        <div id="existing-account-fields" class="hidden"></div>
        <div id="manual-account-fields" class="hidden"></div>
        <div class="responsemessage"></div>
    </form>
</div>
