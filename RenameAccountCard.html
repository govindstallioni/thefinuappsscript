<!-- Modal overlay -->
<div class="bg-white border border-gray-400 rounded-xl w-full max-w-md overflow-hidden">

    <!-- Header -->
    <div class="px-5 py-4 border-b border-gray-400">
      <h2 class="text-sm font-semibold text-gray-900">Rename Account</h2>
      <p class="text-gray-500 mt-1">Give this account a friendly name</p>
    </div>

    <!-- Form content -->
    <div class="p-5 space-y-5">
      <div>
        <label for="currentName" class="block font-medium text-gray-500 uppercase tracking-wide mb-1">Current Name</label>
        <div class="font-medium text-gray-800 bg-gray-100 px-3 py-2 rounded border border-gray-200"><?= currentName || 'Unnamed Account' ?></div>
      </div>

      <div>
        <label for="newName" class="block font-medium text-gray-700 mb-1.5">New Account Name</label>
        <input type="text" id="newName" 
          class="newName text-xs w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="e.g. Main Checking" 
          value="<?= currentName || '' ?>">
      </div>
      <div class="responsemessage hidden"></div>
    </div>

    <!-- Footer buttons -->
    <div class="px-5 py-4 border-t border-gray-400 flex justify-end gap-3">
      <button id="btnCancelRename"
        class="cursor-pointer px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 font-medium transition">Cancel</button>
      <button id="btnSaveRename" data-account-id="<?= accountId ?>"
        class="cursor-pointer px-5 py-2 theme-bg-primary text-white rounded-lg  font-medium transition">Update Name</button>
    </div>
    <script>
      document.getElementById('btnCancelRename').addEventListener('click', function() { cancelRename(); });
      document.getElementById('btnSaveRename').addEventListener('click', function() { saveRename(this.dataset.accountId, this); });
    </script>

  </div>
