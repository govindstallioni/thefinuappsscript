<script type="text/javascript">

const paymentProcessingTime = 120; // seconds (2 minutes)
let countdownInterval;
let remainingSeconds = paymentProcessingTime; // 90 seconds
let subscriptionPollIntervalId = null;
let userNavigated = false; // when true, don't auto-navigate away from user's current step

function getSetupWizardEle(){
  return document.getElementById('setup-wizard');
}

function showSetupWizard() {
  google.script.run.withSuccessHandler(function(response){
    loaderEle.classList.add('hidden');
    mainAppEle.innerHTML = response;
    // refresh UI progress after loading
    refreshSetupProgressUI();
  }).withFailureHandler(function(error){
    loaderEle.classList.add('hidden');
    mainAppEle.innerHTML = response;
  }).showSetupWizardTemplate();
}

// Step Navigation
function handleStepStartFreeTrial(btnEl) {
  startStripeCheckOutProcess(btnEl);
}

function handleTryAgainFreeTrial(btnEl){
  resetPaymentProcessingTime();
  startStripeCheckOutProcess(btnEl);
}

function resetPaymentProcessingTime(){
  remainingSeconds = paymentProcessingTime;
}

function startStripeCheckOutProcess(btnEle){
  if (!btnEle) return;
  if (btnEle.dataset.disabled === 'true') return; // debounce
  // 1. Start Button Event
  buttonEventStart(btnEle, "Please wait..");     
  btnEle.dataset.disabled = 'true';
  // 2. Start countdown (visual)
  startSubscribeCountdown(btnEle);
  // 3. Open Stripe Checkout
  google.script.run.withSuccessHandler(function(response) {
    if (response && response.checkoutUrl) {
      window.open(response.checkoutUrl, '_blank');
      // start polling for subscription status (timeout uses paymentProcessingTime)
      pollForSubscription(btnEle, 5000, paymentProcessingTime * 1000); // poll every 5s for configured time
    }else{
      buttonEventEnd(btnEle, "Start Free Trial");
      btnEle.dataset.disabled = 'false';
      alert('Failed to create checkout session');
    }
  }).withFailureHandler(function(err) {
    buttonEventEnd(btnEle, "Start Free Trial");
    btnEle.dataset.disabled = 'false';
    alert(err);
  }).createStripeSession();
}

function pollForSubscription(btnEle, interval = 5000, timeout = paymentProcessingTime * 1000){
  const startAt = Date.now();
  // clear any previous poll
  if (subscriptionPollIntervalId) {
    clearInterval(subscriptionPollIntervalId);
    subscriptionPollIntervalId = null;
  }

  subscriptionPollIntervalId = setInterval(() => {
    google.script.run.withSuccessHandler(function(response){
      // if subscription detected -> stop everything and advance
      if (response && response.success === true && response.subscribed === true){
        clearInterval(subscriptionPollIntervalId);
        subscriptionPollIntervalId = null;
        if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        try{ nextStep(3); }catch(e){}
        if (btnEle) { buttonEventEnd(btnEle, "Subscribed"); btnEle.dataset.disabled = 'false'; }
        return;
      }

      // not subscribed yet: check for timeout
      if (Date.now() - startAt >= timeout){
        clearInterval(subscriptionPollIntervalId);
        subscriptionPollIntervalId = null;
        if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        remainingSeconds = paymentProcessingTime;
        if (btnEle) { buttonEventEnd(btnEle, "Start Free Trial"); btnEle.dataset.disabled = 'false'; }

        const appNotification = document.querySelector('#subscription-status') || document.querySelector('#app-notification');
        if (appNotification){
          appNotification.innerHTML = '<div class="text-red-600 mb-3">Subscription not detected yet. Please try again or contact support.</div>';
          appNotification.classList.remove('hidden');
        }

        //try{ nextStep(1); }catch(e){}
        return;
      }
      // otherwise continue polling until timeout or success
    }).withFailureHandler(function(err){
      // on error, stop polling and show message
      if (subscriptionPollIntervalId){ clearInterval(subscriptionPollIntervalId); subscriptionPollIntervalId = null; }
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
      if (btnEle) { buttonEventEnd(btnEle, "Try Again"); btnEle.dataset.disabled = 'false'; }
      const appNotification = document.querySelector('#subscription-status') || document.querySelector('#app-notification');
      if (appNotification){
        appNotification.innerHTML = '<div class="text-red-600">Error checking subscription. Please try again.</div>';
        appNotification.classList.remove('hidden');
      }
    }).verifySubscriptionStatus();
  }, interval);
}

function startSubscribeCountdown(btn) {
  // clear any existing interval first
  if (typeof countdownInterval !== 'undefined' && countdownInterval) {
    clearInterval(countdownInterval);
  }
  updateButtonText(btn);
  countdownInterval = setInterval(() => {
    remainingSeconds--;
    updateButtonText(btn);
    if (remainingSeconds <= 0) {
      clearInterval(countdownInterval);
      countdownInterval = null;
      // countdown ended — show checking state while poll continues
      if (btn) {
        const textEl = btn.querySelector && btn.querySelector('.btn-text');
        if (textEl) textEl.innerText = 'Checking...';
      }
    }
  }, 1000);
}

function updateButtonText(btn) {
  if (!btn) return;
  const textEl = btn.querySelector && btn.querySelector('.btn-text');
  if (!textEl) return;
  if (remainingSeconds <= 0) {
    textEl.innerText = 'Checking...';
    return;
  }
  const min = Math.floor(remainingSeconds / 60);
  const sec = remainingSeconds % 60;
  textEl.innerText = `Waiting (${min}:${sec.toString().padStart(2, '0')})`;
}

function refreshSetupProgressUI(){
  // fetch current progress from server and update UI
  google.script.run.withSuccessHandler(function(progress){
    if (!progress) return;
    console.log(progress);
    applyProgressToSteps(progress);
  }).getSetupWizardProgress();
}

function applyProgressToSteps(progress){
  try{
    // if user manually navigated, don't auto-switch steps
    if (userNavigated) return;

    // hide all steps
    document.querySelectorAll('#setup-wizard > div').forEach(div => div.classList.add('hidden'));
    // decide which step to show
    if (progress.subscription && progress.subscription.status === 'active'){
      if (!(progress.template && progress.template.status === 'completed')){
        // show template step
        const el = document.getElementById('step-3'); if (el) el.classList.remove('hidden');
        return;
      }
      if (!(progress.config && progress.config.status === 'completed')){
        const el = document.getElementById('step-4'); if (el) el.classList.remove('hidden');
        return;
      }
      // all steps complete
      const el = document.getElementById('step-5'); if (el) el.classList.remove('hidden');
      return;
    }else{
      // subscription not active - show subscription step (step-2) if user already entered welcome
      const elWelcome = document.getElementById('step-1');
      const elSub = document.getElementById('step-2');
      // If user already started (e.g., subscription checkout started), show subscription step
      if (progress.subscription && progress.subscription.status && progress.subscription.status !== 'pending'){
        if (elSub) elSub.classList.remove('hidden');
      }else{
        // default to welcome
        if (elWelcome) elWelcome.classList.remove('hidden');
      }
    }
  }catch(e){ console.warn('applyProgressToSteps', e); }
}

function nextStep(n){
  // mark that the user has manually navigated so auto UI refresh won't override
  userNavigated = true;
  appNotificationEle.innerHTML = '';
  document.querySelectorAll('#setup-wizard > div').forEach(div => div.classList.add('hidden'));
  document.getElementById('step-' + n).classList.remove('hidden');
}

function launchApp(btnEl) {
  buttonEventStart(btnEl, "Launching..");
  google.script.run.showSidebar();
}

function handleStepInstallTemplate(btnEle){
  const stepEl = btnEle.closest('[id^="step-"]');
  buttonEventStart(btnEle, "Installing");
  google.script.run.withSuccessHandler(function(response){
    if( response.status === true ){
      btnEle.classList.add('hidden');
      showStepBlockMessageElement({
        stepEle: stepEl, 
        message: response.message, 
        status: 'success'
      });
      showNextStepButtonElement(stepEl, 4);
    }else{
      showStepBlockMessageElement({
        stepEle: stepEl, 
        message: response.message, 
        status: 'failed'
      });
      buttonEventEnd(btnEle, "Install Template");
    }
  }).withFailureHandler(function(error){
    showStepBlockMessageElement({
      stepEle: stepEl, 
      message: error.message, 
      status: 'failed'
    });
    buttonEventEnd(btnEle, "Install Template");
  }).installTemplateInitialSetup();
}

function handleStepSaveConfiguration(btnEle){
  const stepEl = btnEle.closest('[id^="step-"]');
  if (!stepEl) return;
  const autoSyncCheckbox = stepEl.querySelector('#autosync');
  const isAutoSyncEnabled = autoSyncCheckbox.checked;
  buttonEventStart(btnEle, "Saving..");
  google.script.run.withSuccessHandler((response) => {
    if( response.status === true ){
      btnEle.classList.add('hidden');
      showStepBlockMessageElement({
        stepEle: stepEl, 
        message: response.message, 
        status: 'success'
      });
      showNextStepButtonElement(stepEl, 5);
    }else{
      showStepBlockMessageElement({
        stepEle: stepEl, 
        message: response.message, 
        status: 'failed'
      });
      buttonEventEnd(btnEle, "Save Configuration");
    }
  }).withFailureHandler((error) => {
    showStepBlockMessageElement({
      stepEle: stepEl, 
      message: error.message, 
      status: 'failed'
    });
    buttonEventEnd(btnEle, "Save Configuration");
  }).saveConfiguration({
      autoSync: isAutoSyncEnabled,
      sheetEditInstant: true
  });
}

function goToNextStep(btn, nextstep) {
  const stepEl = btn.closest('[id^="step-"]');
  const wizardEl = stepEl.closest('#setup-wizard');

  stepEl.classList.add('hidden');

  const nextStep = wizardEl.querySelector('#step-'+ nextstep);
  if (nextStep) {
    nextStep.classList.remove('hidden');
  }
}

function showStepBlockMessageElement( data ){
  if( data.status === 'success' ){
    data.stepEle.querySelector('.step-messages').innerHTML = actionSuccessMessage(data.message);
    data.stepEle.querySelector('.step-messages').classList.remove("hidden");
  }else{
    data.stepEle.querySelector('.step-messages').innerHTML = actionFailureMessage(data.message);
    data.stepEle.querySelector('.step-messages').classList.remove("hidden");
  }
}

function showNextStepButtonElement( stepEle, nextStep ){
  if (stepEle.querySelector('.next-step-btn')) return;
  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.innerText = 'Next';
  nextBtn.className = 'next-step-btn cursor-pointer w-full theme-bg-primary text-white py-2 rounded mt-4';
  nextBtn.onclick = function () {
    goToNextStep(nextBtn, nextStep);
  };
  stepEle.appendChild(nextBtn);
}
</script>
