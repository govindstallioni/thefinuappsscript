<button onclick="goBackAccountListCard();" class="cursor-pointer flex-1 py-2 px-2 bg-gray-300 text-xs border border-gray-300 text-gray-800 rounded-lg hover:bg-gray-50 font-medium transition w-full mb-2">Go Back</button>
<!-- Main Content -->
<div class="bg-white rounded-xl border border-gray-400 overflow-hidden">
  <!-- Header / Bank Info -->
  <div class="flex items-center justify-between gap-2.5 px-4 py-4 border-b border-gray-400">
    <div>
      <h2 class="font-bold text-gray-900 text-sm">
        <?= account?.name || 'Unnamed Account' ?>
      </h2>
      <p class="text-gray-600">
        <?= account?.institution_name || 'Unknown Institution' ?>
      </p>
    </div>
    <? if (account?.is_linked === true) { ?>
      <small class="inline-flex items-center px-2.5 py-1 rounded-full font-medium bg-green-100 text-green-800">Linked</small>
    <? } else { ?>
      <small class="inline-flex items-center px-2.5 py-1 rounded-full font-medium bg-red-100 text-red-800">Unlinked</small>
    <? } ?>
  </div>

  <!-- Details Grid -->
  <div class="px-4 py-4 space-y-4">
    <div>
      <div class="text-gray-500 uppercase tracking-wide mb-1">Account #</div>
      <div class="font-medium text-gray-900">•••• <?= account?.mask || 'XXXX' ?></div>
    </div>
    <div>
      <div class="text-gray-500 uppercase tracking-wide mb-1">Type</div>
      <div class="font-medium text-gray-900 capitalize">
        <?= account?.type || '—' ?>
        <? if (account?.subtype) { ?>
          <span class="text-gray-500">· <?= account.subtype ?></span>
        <? } ?>
      </div>
    </div>
    <div>
      <div class="text-gray-500 uppercase tracking-wide mb-1">Official Name</div>
      <div class="font-medium text-gray-900">
        <?= account?.account_name || '—' ?>
      </div>
    </div>
   
    <!-- Status Information -->
    <div>
      <div class="text-gray-500 uppercase tracking-wide mb-1">Status</div>
      <div class="text-gray-700">
        <? if( account.is_linked == true ){ ?> Linked <? } else { ?> Unlinked <? } ?>Transactions and balance updates for this account will sync with spreadsheet
      </div>
    </div>

  </div>

  <!-- Action Buttons -->
  <div class="px-5 py-5 bg-gray-50 border-t border-gray-400 flex flex-col sm:flex-row gap-1">
    <button data-account-id="<?= account?.account_id ?>" data-account-name="<?= account?.name ?>" class="btn-rename cursor-pointer flex-1 py-2 px-2 bg-white border border-gray-300 text-gray-800 rounded-lg font-medium transition">Rename Account</button>
    <? if( account.is_linked === true ){ ?>
      <button data-account-id="<?= account?.account_id ?>" class="btn-unlink cursor-pointer flex-1 py-2 px-2 theme-bg-primary text-white rounded-lg font-medium transition">Unlink from Spreadsheet</button>
    <? } else { ?>
      <button data-account-id="<?= account?.account_id ?>" class="btn-link cursor-pointer flex-1 py-2 px-2 theme-bg-primary text-white rounded-lg font-medium transition">Link to Template</button>
    <? } ?>
    <button data-account-id="<?= account?.account_id ?>" class="btn-remove cursor-pointer flex-1 py-2 px-2 bg-red-50 text-red-700 border border-red-200 rounded-lg hover:bg-red-100 font-medium transition">Remove from ThefinU</button>
  </div>
  <script>
    document.querySelectorAll('.btn-rename').forEach(function(btn) {
      btn.addEventListener('click', function() { renameAccount(this.dataset.accountId, this.dataset.accountName); });
    });
    document.querySelectorAll('.btn-unlink').forEach(function(btn) {
      btn.addEventListener('click', function() { unlinkAccountFromTemplate(this.dataset.accountId, this); });
    });
    document.querySelectorAll('.btn-link').forEach(function(btn) {
      btn.addEventListener('click', function() { linkAccountToTemplate(this.dataset.accountId, this); });
    });
    document.querySelectorAll('.btn-remove').forEach(function(btn) {
      btn.addEventListener('click', function() { removeAccount(this.dataset.accountId); });
    });
  </script>
</div>
