<div class="mb-4 flex items-center gap-2">
  <button onclick="goBackFromRemoveAccounts()"
    class="cursor-pointer flex items-center gap-1 text-gray-600 hover:text-gray-900 font-medium transition text-sm">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </button>
  <h2 class="font-semibold text-gray-900">Remove Account(s)</h2>
</div>

<? if( groupedAccounts.length === 0 ) { ?>
  <p class="text-gray-600 text-center mt-5">No connected accounts found.</p>
<? } else { ?>
  <? groupedAccounts.forEach(function(group) { ?>
    <div class="mb-4">
      <!-- Institution Header -->
      <div class="flex items-center gap-2 mb-2 px-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E8277" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="11" rx="1"/><path d="M12 2L2 7h20L12 2z"/><line x1="12" y1="12" x2="12" y2="17"/><line x1="8" y1="12" x2="8" y2="17"/><line x1="16" y1="12" x2="16" y2="17"/></svg>
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
          <?= group.institution_name ?>
        </span>
      </div>

      <!-- Accounts under this institution -->
      <div class="grid gap-2">
        <? group.accounts.forEach(function(account) { ?>
          <div class="bg-white rounded-lg border border-gray-300 overflow-hidden">
            <div class="px-3.5 py-3 flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="font-medium text-gray-900 leading-tight truncate">
                  <?= account.name || 'Unknown' ?>
                </div>
                <div class="text-gray-500 text-xs mt-1">
                  •••• <?= account.mask || 'XXXX' ?>
                </div>
              </div>
              <? if( account.is_linked ){ ?>
                <small class="px-1.5 py-0.5 rounded-full bg-green-100 text-green-800 shrink-0">Linked</small>
              <? } else { ?>
                <small class="px-1.5 py-0.5 rounded-full bg-red-100 text-red-800 shrink-0">Unlinked</small>
              <? } ?>
            </div>
            <div class="border-t border-gray-200 px-3.5 py-2">
              <button class="cursor-pointer btn-remove-account w-full py-1.5 px-2 bg-red-50 text-red-700 border border-red-200 rounded-lg font-medium text-sm hover:bg-red-100 transition"
                      data-account-id="<?= account.account_id ?>">
                Remove Account
              </button>
            </div>
          </div>
        <? }); ?>
      </div>
    </div>
  <? }); ?>
<? } ?>
