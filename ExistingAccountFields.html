<? if ( accounts.length > 0 ) { ?>
    <div>
        <label for="account-select" class="block text-sm font-medium text-gray-700 mb-2">Select an existing account:</label>
        <select id="account-select" name="accountName" class="block w-full mt-1 border-gray-300 rounded-md focus:border-blue-500 focus:ring-blue-500 border border-gray-400 py-3 px-3">
            <? accounts.forEach(function(account) { ?>
                <option value="<?= account.id ?>"><?= account.name ?></option>
            <? }); ?>
        </select>
    </div>
    <div>
        <label for="accountBalance" class="block text-sm font-medium text-gray-700 mt-4 mb-2">Enter your balance:</label>
        <input type="number" id="accountBalance" name="accountBalance" class="block w-full mt-1 rounded-md focus:border-blue-500 focus:ring-blue-500 border border-gray-400 py-3 px-3" placeholder="e.g., 1000.00" step="0.01" />
    </div>
    <div>
        <label for="balanceDate" class="block text-sm font-medium text-gray-700 mt-4 mb-2">Select the date:</label>
        <input type="date" id="balanceDate" name="balanceDate" class="block w-full mt-1 rounded-md focus:border-blue-500 focus:ring-blue-500 border border-gray-400 py-3 px-3" />
    </div>
    <div class="mt-5">
        <input type="hidden" name="accountType" value="existing" />
        <button type="submit" class="cursor-pointer block w-full px-6 py-3 theme-bg-primary text-white rounded-lg font-medium transition">Add Balance History</button>
    </div>
<? } else { ?>
    <p>No connected bank accounts yet</p>
<? } ?>
