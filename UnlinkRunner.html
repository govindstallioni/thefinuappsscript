<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>body{font-family:'Comfortaa',sans-serif;padding:16px;background:#fff}</style>
</head>
<body>
  <div class="w-full max-w-md mx-auto">
    <div id="statusDetail" class="text-sm mb-3">
      <div class="flex items-center gap-3">
        <div class="font-semibold">Status:</div>
        <div id="statusBadge" class="px-2 py-1 rounded text-sm bg-yellow-50 border border-yellow-100 text-yellow-800">Pending</div>
      </div>
    </div>
    <div id="log" class="text-xs text-gray-700 h-28 overflow-auto bg-white p-2 rounded border"></div>
    <div id="resultPanel" class="mt-3 hidden p-2 text-sm max-h-28 overflow-auto"></div>

    <div class="mt-4 flex space-x-2">
      <button id="closeBtn" class="flex-1 bg-gray-300 text-gray-800 py-2 rounded cursor-pointer" style="display:none" onclick="closeDialog()">Close</button>
    </div>
  </div>

<script>
  const accountId = '<?!= accountId ?>';
  const logEl = document.getElementById('log');
  const closeBtn = document.getElementById('closeBtn');

  function appendLog(msg){ const now = new Date().toLocaleTimeString(); logEl.innerText = now + ' — ' + msg + '\n' + logEl.innerText; }

  // Update status badge: pending, processing, completed, error
  function setStatus(state, message){
    const badge = document.getElementById('statusBadge');
    badge.className = 'px-2 py-1 rounded text-sm';
    let cls = '';
    let label = '';
    switch((state||'').toLowerCase()){
      case 'pending': cls = 'bg-yellow-50 border border-yellow-100 text-yellow-800'; label = 'Pending'; break;
      case 'processing': cls = 'bg-sky-50 border border-sky-100 text-sky-800'; label = 'Processing'; break;
      case 'completed': cls = 'bg-emerald-50 border border-emerald-100 text-emerald-800'; label = 'Completed'; break;
      case 'error': cls = 'bg-red-50 border border-red-100 text-red-800'; label = 'Error'; break;
      default: cls = 'bg-slate-50 border border-slate-100 text-slate-800'; label = state || 'Status';
    }
    badge.className += ' ' + cls;
    badge.textContent = label + (message ? (' — ' + message) : '');
  }
  function closeDialog(){
    try{
      const btn = document.getElementById('closeBtn');
      if(btn){ btn.disabled = true; btn.textContent = 'Closing...'; }
      // fire-and-forget showSidebar then close immediately to improve responsiveness
      try{ 
        google.script.run.showSidebar(); 
        google.script.host.close();
        }catch(e){}
    }catch(e){ try{ google.script.host.close(); }catch(e){} }
  }
  function cancel(){ appendLog('User cancelled.'); try{ google.script.host.close(); }catch(e){} }

  function runUnlink(){
    appendLog('Starting unlink for account ' + accountId);
    setStatus('processing');
    google.script.run.withSuccessHandler(function(res){
      if(res && res.success){
        appendLog('Unlink completed.');
        setStatus('completed');
        // Show Close button for user to dismiss; clicking it will refresh the sidebar
        closeBtn.style.display = 'block';
      } else {
        appendLog('Unlink failed: ' + (res && res.error));
        setStatus('error', res && (res.error || res.message));
        closeBtn.style.display = 'block';
      }
    }).withFailureHandler(function(err){ appendLog('Unlink error: ' + err); appendLog('Error'); setStatus('error', err && err.message); closeBtn.style.display='block'; }).processUnlinkAccountTask(accountId);
  }

  document.addEventListener('DOMContentLoaded', function(){ runUnlink(); });
</script>
</body>
</html>
