<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      :root{
        --primary-font: 'Comfortaa', sans-serif;
        --color_01 : #6E8277;
        --color_02 : #37484C;
        --color_03 : #6E434D;
        --color_04 : #E68E68;
        --color_05 : #EEC49F;
        --color_06 : #E9EAD1;
      }
      .theme-primary { color: var(--color_02); }
      .theme-secondary { color: var(--color_01); }
      .theme-accent { color: var(--color_03); }
      .theme-light { color: var(--color_04); }
      .theme-semi-light { color: var(--color_06); }
      .theme-bg-primary { background-color: var(--color_02); }
      .theme-bg-secondary { background-color: var(--color_01); }
      .theme-bg-accent { background-color: var(--color_03); }
      .theme-bg-light { background-color: var(--color_04); }
      .theme-bg-semi-light { background-color: var(--color_06); }
      body { font-family: var(--primary-font); padding: 0; margin: 0; background: #f9fafb; }
      .hidden { display: none !important; }
      .p-4 { padding: 1rem; }
      .tab-btn.active { border-bottom: 2px solid #1a73e8; color: #1a73e8; }
      /* Simple CSS Spinner */
      #loader, .tab-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      /* Spinner Animation */
      .btn-spinner {
        display: inline-block;
        width: 1rem;
        height: 1rem;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.6s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Flex layout for button to keep text left and loader right */
      .btn-loading-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      /* Style for disabled state */
      button:disabled {
        background-color: #93c5fd !important; /* Lighter blue */
        cursor: not-allowed;
      }
    </style>
  </head>
  <body class="text-xs">

    <div id="loader">

    </div>
